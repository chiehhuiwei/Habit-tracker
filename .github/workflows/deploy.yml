name: Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            TARGET_DIR="$HOME/Habit-tracker"
            mkdir -p "$TARGET_DIR/line_data"

            IMAGE_NAME="${{ env.REGISTRY }}/${{ github.repository }}:latest"

            # 登入 GHCR 並直接 Pull 預先編譯好的映像檔（極速，不消耗 VM CPU/RAM）
            echo "$GITHUB_TOKEN" | sudo docker login ${{ env.REGISTRY }} -u "$GITHUB_ACTOR" --password-stdin
            sudo docker pull "$IMAGE_NAME"

            # 停止並移除舊容器
            sudo docker stop habit-tracker 2>/dev/null || true
            sudo docker rm habit-tracker 2>/dev/null || true

            # 啟動容器（監聽 127.0.0.1:7860，設定記憶體上限 384m）
            sudo docker run -d \
              --name habit-tracker \
              -p 127.0.0.1:7860:7860 \
              --memory=384m \
              --restart always \
              --env-file "$TARGET_DIR/.env" \
              -v "$TARGET_DIR/line_data:/app/line_data" \
              -e GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json \
              -v "$TARGET_DIR/gcp-key.json:/app/gcp-key.json:ro" \
              "$IMAGE_NAME"

            sleep 2
            sudo docker ps --filter "name=habit-tracker"
            echo "⚡ 部署完成！"
