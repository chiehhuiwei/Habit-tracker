name: Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            TARGET_DIR="$HOME/Habit-tracker"

            # 確保目錄存在並進入
            cd "$TARGET_DIR"

            # 確保代碼為最新版
            git pull origin main

            # 確保資料夾存在
            mkdir -p line_data

            # 停止舊容器
            sudo docker stop habit-tracker 2>/dev/null || true
            sudo docker rm habit-tracker 2>/dev/null || true

            # 直接使用 docker compose 本地建置並啟動 habit-tracker 服務
            sudo docker compose up -d --build habit-tracker

            echo "✅ habit-tracker 成功啟動！"
            sudo docker ps | grep habit-tracker
