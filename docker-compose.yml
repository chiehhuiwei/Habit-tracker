services:
  habit-tracker:
    build: .
    image: habit-tracker:latest
    container_name: habit-tracker
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    mem_limit: 384m
    memswap_limit: 384m
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
    volumes:
      # SQLite 資料庫（line_data/timevest.db），重建 image 不會遺失
      - ./line_data:/app/line_data
      - ./gcp-key.json:/app/gcp-key.json:ro

  # 僅在有獨立網域且未佔用 80/443 時使用（docker compose --profile https up -d）
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - habit-tracker

volumes:
  caddy_data:
